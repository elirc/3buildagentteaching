services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic-education-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic_education_ops
    ports:
      # Host port is configurable so this stack can coexist with any other
      # Postgres you already have running. Override POSTGRES_PORT in .env.
      # The container port stays 5432 — only the host side moves.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_education_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
